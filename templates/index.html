<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPulse - 스마트 할일 관리 웹앱</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="bg-decoration">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
        <div class="glow-sphere sphere-3"></div>
    </div>

    <div class="app-container">
        <!-- Top Navigation Header -->
        <header class="app-header glass-card">
            <div class="brand-section">
                <div class="logo-icon">
                    <i class="fa-solid fa-square-check"></i>
                </div>
                <div>
                    <h1 class="brand-title">TaskPulse</h1>
                    <p class="brand-subtitle" id="current-date-text">스마트 할일 관리 시스템</p>
                </div>
            </div>
            
            <div class="header-actions">
                <button class="btn btn-primary" id="btn-open-create-modal">
                    <i class="fa-solid fa-plus"></i> 새 할일 추가
                </button>
            </div>
        </header>

        <!-- Stats Dashboard -->
        <section class="stats-section grid-3">
            <div class="stat-card glass-card">
                <div class="stat-icon icon-total">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">전체 할일</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
            </div>

            <div class="stat-card glass-card">
                <div class="stat-icon icon-pending">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">진행 중</span>
                    <span class="stat-value" id="stat-pending">0</span>
                </div>
            </div>

            <div class="stat-card glass-card">
                <div class="stat-icon icon-completed">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">완료됨</span>
                    <span class="stat-value" id="stat-completed">0</span>
                </div>
            </div>
        </section>

        <!-- Progress Bar Card -->
        <div class="progress-card glass-card">
            <div class="progress-header">
                <span class="progress-title"><i class="fa-solid fa-chart-line"></i> 오늘의 달성률</span>
                <span class="progress-percent" id="stat-rate-text">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="stat-rate-bar" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Controls: Filters & Search -->
        <section class="controls-section glass-card">
            <div class="tabs-group" id="status-tabs">
                <button class="tab-btn active" data-status="all">
                    <i class="fa-solid fa-border-all"></i> 전체
                </button>
                <button class="tab-btn" data-status="active">
                    <i class="fa-solid fa-fire"></i> 진행 중
                </button>
                <button class="tab-btn" data-status="completed">
                    <i class="fa-solid fa-check-double"></i> 완료
                </button>
            </div>

            <div class="filters-group">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" placeholder="할일 검색..." autocomplete="off">
                </div>

                <select id="filter-category" class="select-input">
                    <option value="all">모든 카테고리</option>
                    <option value="업무">업무</option>
                    <option value="기획">기획</option>
                    <option value="디자인">디자인</option>
                    <option value="개인">개인</option>
                    <option value="기타">기타</option>
                </select>

                <select id="filter-priority" class="select-input">
                    <option value="all">모든 우선순위</option>
                    <option value="긴급">🚨 긴급</option>
                    <option value="높음">🔥 높음</option>
                    <option value="보통">⚡ 보통</option>
                    <option value="낮음">☕ 낮음</option>
                </select>

                <select id="sort-by" class="select-input">
                    <option value="due_date">마감일순</option>
                    <option value="priority">우선순위순</option>
                    <option value="created_at">최신 등록순</option>
                </select>
            </div>
        </section>

        <!-- Todo List Container -->
        <main class="todo-list-container" id="todo-list">
            <!-- Dynamic JS Todo Cards Rendered Here -->
            <div class="loading-state">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <p>할일 목록을 불러오는 중입니다...</p>
            </div>
        </main>
    </div>

    <!-- Create / Edit Todo Modal -->
    <div class="modal-backdrop" id="todo-modal">
        <div class="modal-card glass-card">
            <div class="modal-header">
                <h2 id="modal-title"><i class="fa-solid fa-plus-circle"></i> 새 할일 등록</h2>
                <button class="btn-close" id="btn-close-modal">&times;</button>
            </div>
            <form id="todo-form">
                <input type="hidden" id="form-todo-id">
                
                <div class="form-group">
                    <label for="form-title">할일 제목 <span class="required">*</span></label>
                    <input type="text" id="form-title" placeholder="예: Flask API 헬스체크 작성하기" required>
                </div>

                <div class="form-group">
                    <label for="form-description">상세 설명</label>
                    <textarea id="form-description" rows="3" placeholder="상세 내용이나 참고 사항을 입력하세요..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group col-half">
                        <label for="form-category">카테고리</label>
                        <select id="form-category">
                            <option value="업무">업무</option>
                            <option value="기획">기획</option>
                            <option value="디자인">디자인</option>
                            <option value="개인">개인</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>

                    <div class="form-group col-half">
                        <label for="form-priority">우선순위</label>
                        <select id="form-priority">
                            <option value="보통" selected>⚡ 보통</option>
                            <option value="긴급">🚨 긴급</option>
                            <option value="높음">🔥 높음</option>
                            <option value="낮음">☕ 낮음</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="form-due-date">마감 기한</label>
                    <input type="date" id="form-due-date">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btn-cancel-modal">취소</button>
                    <button type="submit" class="btn btn-primary" id="btn-save-todo">
                        <i class="fa-solid fa-check"></i> 저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
