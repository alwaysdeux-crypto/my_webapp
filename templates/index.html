<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四柱命理 - 사주관리 웹앱</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="bg-decoration">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
        <div class="glow-sphere sphere-3"></div>
    </div>

    <div class="app-container">
        <!-- Top Navigation Header -->
        <header class="app-header glass-card">
            <div class="brand-section">
                <div class="logo-icon">
                    <i class="fa-solid fa-yin-yang"></i>
                </div>
                <div>
                    <h1 class="brand-title">四柱命理</h1>
                    <p class="brand-subtitle">사주팔자 계산 &amp; 프로필 관리</p>
                </div>
            </div>

            <div class="header-actions">
                <button class="btn btn-primary" id="btn-open-create-modal">
                    <i class="fa-solid fa-plus"></i> 새 사주 등록
                </button>
            </div>
        </header>

        <!-- Stats Dashboard -->
        <section class="stats-section grid-3">
            <div class="stat-card glass-card">
                <div class="stat-icon icon-total">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">전체 등록</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
            </div>

            <div class="stat-card glass-card">
                <div class="stat-icon icon-male">
                    <i class="fa-solid fa-mars"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">남성</span>
                    <span class="stat-value" id="stat-male">0</span>
                </div>
            </div>

            <div class="stat-card glass-card">
                <div class="stat-icon icon-female">
                    <i class="fa-solid fa-venus"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">여성</span>
                    <span class="stat-value" id="stat-female">0</span>
                </div>
            </div>
        </section>

        <!-- Controls: Search -->
        <section class="controls-section glass-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="이름으로 검색..." autocomplete="off">
            </div>
        </section>

        <!-- Profile List Container -->
        <main class="profile-list-container" id="profile-list">
            <div class="loading-state">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <p>사주 프로필을 불러오는 중입니다...</p>
            </div>
        </main>
    </div>

    <!-- Create / Edit Profile Modal -->
    <div class="modal-backdrop" id="profile-modal">
        <div class="modal-card glass-card">
            <div class="modal-header">
                <h2 id="modal-title"><i class="fa-solid fa-plus-circle"></i> 새 사주 등록</h2>
                <button class="btn-close" id="btn-close-modal">&times;</button>
            </div>
            <form id="profile-form">
                <input type="hidden" id="form-profile-id">

                <div class="form-group">
                    <label for="form-name">이름 <span class="required">*</span></label>
                    <input type="text" id="form-name" placeholder="예: 홍길동" required>
                </div>

                <div class="form-row">
                    <div class="form-group col-half">
                        <label for="form-gender">성별</label>
                        <select id="form-gender">
                            <option value="남" selected>남</option>
                            <option value="여">여</option>
                        </select>
                    </div>

                    <div class="form-group col-half">
                        <label for="form-birth-time">출생 시각 (모르면 비워두세요)</label>
                        <input type="time" id="form-birth-time">
                    </div>
                </div>

                <div class="form-group">
                    <label for="form-birth-date">생년월일 (양력) <span class="required">*</span></label>
                    <input type="date" id="form-birth-date" required>
                </div>

                <div class="form-group">
                    <label for="form-memo">메모</label>
                    <textarea id="form-memo" rows="3" placeholder="참고 사항을 입력하세요..."></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btn-cancel-modal">취소</button>
                    <button type="submit" class="btn btn-primary" id="btn-save-profile">
                        <i class="fa-solid fa-check"></i> 저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
